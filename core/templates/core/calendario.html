{% extends 'core/base.html' %}

{% block title %}Calendário de Tarefas - 4U{% endblock %}

{% block content %}
<!-- Carrega o CSS do FullCalendar -->
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />

<h2 class="page-title mb-4">Calendário de Tarefas</h2>

<div class="row">
    <!-- O Calendário Visual -->
    <div class="col-lg-8 mb-4">
        <div class="card shadow-sm border-0 p-3 bg-white">
            <div id="calendar" style="min-height: 450px;"></div>
        </div>
    </div>

    <!-- Painel lateral para mostrar as tarefas do dia selecionado -->
    <div class="col-lg-4">
        <div class="card shadow-sm border-0 p-3 bg-white">
            <h5 class="text-primary mb-3"><i class="bi bi-calendar-check me-1"></i>Tarefas do Dia</h5>
            <div id="detalhes-dia" class="text-muted">
                Clique em um dia no calendário para ver as tarefas agendadas.
            </div>
        </div>
    </div>
</div>

<!-- Carrega o JavaScript do FullCalendar -->
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        
        // Puxa os eventos passados pela view do Django com segurança
        var eventos = {{ eventos_json|safe }};

        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'pt-br',
            events: eventos,
            dateClick: function(info) {
                var dataSelecionada = info.dateStr; // Formato YYYY-MM-DD
                
                // Filtra as tarefas que correspondem à data clicada
                var tarefasDoDia = eventos.filter(function(evento) {
                    return evento.start === dataSelecionada;
                });

                var container = document.getElementById('detalhes-dia');
                
                if (tarefasDoDia.length > 0) {
                    var html = `<p class="fw-bold text-dark">Data: ${dataSelecionada}</p><ul class="list-group">`;
                    
                    tarefasDoDia.forEach(function(t) {
                        var badge = t.concluida ? '<span class="badge bg-success">Concluída</span>' : '<span class="badge bg-warning text-dark">Pendente</span>';
                        
                        // Desenha cada tarefa com o seu respectivo botão de exclusão
                        html += `<li class="list-group-item d-flex justify-content-between align-items-center mb-2">
                                    <div>
                                        <strong>${t.title}</strong><br>${badge}
                                    </div>
                                    <form action="/tarefas/${t.id}/excluir/" method="post" class="m-0">
                                        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                                        <input type="hidden" name="origem" value="calendario">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Deseja realmente excluir esta tarefa?');">Excluir</button>
                                    </form>
                                 </li>`;
                    });
                    
                    html += `</ul>`;
                    container.innerHTML = html;
                } else {
                    container.innerHTML = `<p class="text-muted">Nenhuma tarefa encontrada para o dia ${dataSelecionada}.</p>`;
                }
            }
        });

        calendar.render();
    });
</script>
{% endblock %}
