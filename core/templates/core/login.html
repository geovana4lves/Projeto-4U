{% extends 'core/base.html' %}

{% block title %}Login - 4U{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card auth-card shadow-sm border-0">
            <div class="card-body p-4">
                <span class="text-eyebrow d-block text-center">Bem-vindo de volta</span>
                <h3 class="card-title text-center mt-2 mb-4">Entrar no 4U</h3>

                {% if form.errors %}
                <div class="alert alert-danger">Usuário ou senha inválidos. Tente novamente.</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Usuário</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>

                <p class="text-center mt-3">
                    Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
